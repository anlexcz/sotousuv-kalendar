name: Calendar worker

on:
  workflow_dispatch:
    inputs:
      command:
        description: Worker command
        required: true
        default: health
        type: choice
        options:
          - health
          - event-registry
          - state-audit
          - export

permissions:
  contents: read

concurrency:
  group: sotousuv-kalendar-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation/data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/worker/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/worker/requirements.txt

      - name: Run worker
        working-directory: automation/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CALENDAR_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CALENDAR_CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CALENDAR_CLOUDFLARE_API_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.CALENDAR_GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CALENDAR_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.CALENDAR_GEMINI_API_KEY }}
          CALENDAR_TIMEZONE: Europe/Prague
          PUBLIC_EXPORT_PATH: ../../data/events.json
          EVENT_REGISTRY_PATH: ../../data/event_registry.json
          EVENT_REGISTRY_HTML_PATH: ../../data/event_registry.html
        run: |
          if [ "${{ inputs.command }}" = "event-registry" ]; then
            python event_registry.py
            python event_registry_html.py
          elif [ "${{ inputs.command }}" = "state-audit" ]; then
            python state_audit_test.py
          else
            python main.py "${{ inputs.command }}"
          fi

      - name: Upload event registry artifact
        if: ${{ inputs.command == 'event-registry' }}
        uses: actions/upload-artifact@v4
        with:
          name: sotousuv-kalendar-event-registry
          path: |
            data/event_registry.json
            data/event_registry.html
          if-no-files-found: error
          retention-days: 14

      - name: Upload public export artifact
        if: ${{ inputs.command == 'export' }}
        uses: actions/upload-artifact@v4
        with:
          name: sotousuv-kalendar-public-export
          path: data/events.json
          if-no-files-found: error
          retention-days: 7

# Intentionally no schedule/cron yet.
# Test and migration scripts remain in the repository but are not exposed in the normal UI.
# Production scheduling and deploy to custom hosting require explicit approval.
