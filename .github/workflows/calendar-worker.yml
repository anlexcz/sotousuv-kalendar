name: Calendar worker

on:
  workflow_dispatch:
    inputs:
      command:
        description: Worker command
        required: true
        default: health
        type: choice
        options:
          - health
          - export
          - smoke-test
          - source-test
          - source-parse-test
          - audit-sources
          - import-sources
          - structured-source-test
          - wp-html-source-test
          - resolver-test
          - detail-enrichment-test
          - ai-enrichment-test
          - materialize-test
          - materialize-batch-test
          - materialize-hybrid-test

permissions:
  contents: read

concurrency:
  group: sotousuv-kalendar-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation/data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/worker/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/worker/requirements.txt

      - name: Run worker
        working-directory: automation/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CALENDAR_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CALENDAR_CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CALENDAR_CLOUDFLARE_API_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.CALENDAR_GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CALENDAR_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.CALENDAR_GEMINI_API_KEY }}
          CALENDAR_TIMEZONE: Europe/Prague
          PUBLIC_EXPORT_PATH: ../../data/events.json
        run: |
          if [ "${{ inputs.command }}" = "audit-sources" ]; then
            python source_audit/audit_sources.py
            python source_audit/build_registry.py
          elif [ "${{ inputs.command }}" = "import-sources" ]; then
            python source_audit/audit_sources.py
            python source_audit/build_registry.py
            python source_audit/import_registry.py
          elif [ "${{ inputs.command }}" = "structured-source-test" ]; then
            python structured_source_test.py
          elif [ "${{ inputs.command }}" = "wp-html-source-test" ]; then
            python wp_html_source_test.py
          elif [ "${{ inputs.command }}" = "resolver-test" ]; then
            python resolver_test.py
          elif [ "${{ inputs.command }}" = "detail-enrichment-test" ]; then
            python detail_enrichment_test.py
          elif [ "${{ inputs.command }}" = "ai-enrichment-test" ]; then
            python ai_enrichment_test_v2.py
          elif [ "${{ inputs.command }}" = "materialize-test" ]; then
            python materialize_test.py
          elif [ "${{ inputs.command }}" = "materialize-batch-test" ]; then
            python materialize_batch_test.py
          elif [ "${{ inputs.command }}" = "materialize-hybrid-test" ]; then
            python materialize_hybrid_test.py
          else
            python main.py "${{ inputs.command }}"
          fi

      - name: Upload public export artifact
        if: ${{ inputs.command == 'export' }}
        uses: actions/upload-artifact@v4
        with:
          name: sotousuv-kalendar-public-export
          path: data/events.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload source audit artifact
        if: ${{ inputs.command == 'audit-sources' || inputs.command == 'import-sources' }}
        uses: actions/upload-artifact@v4
        with:
          name: sotousuv-kalendar-source-audit
          path: automation/worker/audit_output/
          if-no-files-found: error
          retention-days: 14

# Intentionally no schedule/cron yet.
# Production scheduling and deploy to custom hosting require explicit approval.
