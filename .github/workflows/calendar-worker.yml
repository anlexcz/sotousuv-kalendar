name: Calendar worker

on:
  workflow_dispatch:
    inputs:
      command:
        description: Worker command
        required: true
        default: health
        type: choice
        options:
          - health
          - collect-batch
          - collect-source
          - ai-free-test
          - event-registry
          - state-audit
          - export
      source_id:
        description: Source ID for collect-source (for example SRC-LEGACY-031)
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"
    - cron: "43 */4 * * *"

permissions:
  contents: read

concurrency:
  group: sotousuv-kalendar-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4
        with:
          ref: automation/data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/worker/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/worker/requirements.txt

      - name: Run worker
        working-directory: automation/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CALENDAR_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CALENDAR_CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CALENDAR_CLOUDFLARE_API_TOKEN }}
          GOOGLE_SHEET_ID: ${{ secrets.CALENDAR_GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.CALENDAR_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.CALENDAR_GEMINI_API_KEY }}
          CALENDAR_TIMEZONE: Europe/Prague
          PUBLIC_EXPORT_PATH: ../../data/events.json
          EVENT_REGISTRY_PATH: ../../data/event_registry.json
          EVENT_REGISTRY_HTML_PATH: ../../data/event_registry.html
          COLLECT_BATCH_SIZE: 20
          COLLECT_MAX_ITEMS_PER_SOURCE: 10
          COLLECT_MAX_FEED_AGE_DAYS: 180
          COLLECT_RECHECK_HOURS: 24
          AI_MODEL: gemini-3.5-flash-lite
          AI_MAX_CASES: 1
          AI_MAX_RETRIES: 1
          AI_MAX_OUTPUT_TOKENS: 1000
          AI_FREE_DAILY_LIMIT: 6
          AI_FREE_SCAN_LIMIT: 25
        run: |
          COMMAND="${{ inputs.command }}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "43 */4 * * *" ]; then
              COMMAND="ai-free-test"
            else
              COMMAND="collect-batch"
              export COLLECT_DUE_ONLY=1
            fi
          fi

          if [ "$COMMAND" = "collect-batch" ]; then
            python source_collector_runner.py
          elif [ "$COMMAND" = "collect-source" ]; then
            if [ -z "${{ inputs.source_id }}" ]; then
              echo "source_id is required for collect-source" >&2
              exit 2
            fi
            export COLLECT_SOURCE_ID="${{ inputs.source_id }}"
            python source_collector_runner.py
          elif [ "$COMMAND" = "ai-free-test" ]; then
            python ai_free_tier_runner.py
          elif [ "$COMMAND" = "event-registry" ]; then
            python event_registry.py
            python event_registry_html.py
          elif [ "$COMMAND" = "state-audit" ]; then
            python state_audit_test.py
          else
            python main.py "$COMMAND"
          fi

      - name: Upload event registry artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.command == 'event-registry' }}
        uses: actions/upload-artifact@v4
        with:
          name: sotousuv-kalendar-event-registry
          path: |
            data/event_registry.json
            data/event_registry.html
          if-no-files-found: error
          retention-days: 14

      - name: Upload public export artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.command == 'export' }}
        uses: actions/upload-artifact@v4
        with:
          name: sotousuv-kalendar-public-export
          path: data/events.json
          if-no-files-found: error
          retention-days: 7

# Hourly schedule: source-only collection of due sources.
# Every four hours: at most one Gemini 3.5 Flash Lite attempt, capped at six attempts/day in D1.
# Neither path creates events or publishes anything.
# Production event materialization remains disabled until separately approved.
