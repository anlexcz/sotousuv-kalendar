name: Deploy calendar admin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-worker/**"
      - ".github/workflows/deploy-admin.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-worker/package.json

      - name: Install Wrangler
        working-directory: admin-worker
        run: npm install

      - name: Build Wrangler config
        working-directory: admin-worker
        run: |
          cat > wrangler.toml <<EOF
          name = "sotousuv-kalendar-admin"
          main = "src/index_v3.js"
          compatibility_date = "2026-10-20"
          workers_dev = true

          [[d1_databases]]
          binding = "DB"
          database_name = "sotousuv-kalendar"
          database_id = "${{ secrets.CALENDAR_CLOUDFLARE_D1_DATABASE_ID }}"
          EOF

      - name: Deploy worker
        working-directory: admin-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CALENDAR_CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CALENDAR_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure admin password
        working-directory: admin-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CALENDAR_CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CALENDAR_CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.CALENDAR_ADMIN_PASSWORD }}
        run: printf '%s' "$VALUE" | npx wrangler secret put ADMIN_PASSWORD

      - name: Configure session secret
        working-directory: admin-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CALENDAR_CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CALENDAR_CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.CALENDAR_ADMIN_SESSION_SECRET }}
        run: printf '%s' "$VALUE" | npx wrangler secret put ADMIN_SESSION_SECRET

      - name: Configure GitHub API token
        working-directory: admin-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CALENDAR_CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CALENDAR_CLOUDFLARE_ACCOUNT_ID }}
          VALUE: ${{ secrets.CALENDAR_ADMIN_GITHUB_TOKEN }}
        run: printf '%s' "$VALUE" | npx wrangler secret put GITHUB_TOKEN
