<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Šotoušův kalendář – přehled dopravních akcí">
  <title>Šotoušův kalendář</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#">Šotoušův kalendář</a>
  <nav><button class="icon-btn" aria-label="Vyhledat">⌕</button><button class="icon-btn" aria-label="Menu">☰</button></nav>
</header>
<main>
  <section class="hero">
    <p class="eyebrow">Dopravní akce na jednom místě</p>
    <h1>Kam vyrazit za dopravou?</h1>
    <p class="lead">Historické jízdy, dny otevřených dveří, výstavy i další dopravní akce.</p>
    <div class="quick">
      <button class="chip active">Nejbližší</button><button class="chip">Dnes</button><button class="chip">Tento víkend</button><button class="chip">Příští víkend</button>
    </div>
    <div class="filters">
      <label><span>Kde</span><select><option>Všude</option><option>Praha</option><option>Jihočeský kraj</option></select></label>
      <label><span>Doprava</span><select><option>Všechny druhy</option><option>Železnice</option><option>Tramvaje</option><option>Autobusy</option></select></label>
      <button class="primary">Zobrazit akce</button>
    </div>
  </section>
  <section class="content">
    <div class="section-head"><div><p class="eyebrow">Nejbližší</p><h2>Co se chystá</h2></div><div class="view-switch"><button class="selected">Seznam</button><button>Týden</button><button>Měsíc</button></div></div>
    <div id="events"></div>
  </section>
</main>
<footer>První návrh · Šotoušův kalendář</footer>
<script src="app.js"></script>
</body>
</html>
