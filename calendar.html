<!doctype html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalendář – Šotoušův kalendář</title><link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="index.html"><img src="assets/metrobus-symbol.svg" alt=""><span>ŠOTOUŠŮV KALENDÁŘ</span></a><nav><a href="index.html">Akce</a><a href="calendar.html">Kalendář</a></nav></header><main class="page"><div class="month-head"><h1>Říjen 2026</h1><a href="index.html">Seznam akcí</a></div><div class="calendar-grid" id="calendar"></div></main><script src="events.js"></script><script>
const names=["Po","Út","St","Čt","Pá","So","Ne"],box=document.querySelector("#calendar");box.innerHTML=names.map(x=>'<div class="weekday">'+x+'</div>').join("");const first=new Date(2026,9,1),offset=(first.getDay()+6)%7;for(let i=0;i<offset;i++)box.innerHTML+='<div class="cal-day"></div>';for(let d=1;d<=31;d++){let ds=d+". 10. 2026",ev=EVENTS.filter(e=>e.from===ds);box.innerHTML+=`<div class="cal-day"><strong>${d}.</strong>${ev.map(e=>`<a class="cal-event" href="detail.html?id=${encodeURIComponent(e.id)}">${e.title}</a>`).join("")}</div>`}</script></body></html>
