<!doctype html>
<html lang="cs">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Detail akce – Šotoušův kalendář</title>
 <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">
 <link rel="stylesheet" href="styles.css">
</head>
<body class="page-detail">
<header class="topbar">
 <a class="brand" href="index.html"><img src="assets/metrobus-symbol.svg" alt=""><span>ŠOTOUŠŮV KALENDÁŘ</span></a>
 <nav class="main-nav"><a href="index.html">Akce</a><a href="calendar.html">Kalendář</a><a href="add.html">Přidat akci</a><a href="about.html">O projektu</a></nav>
</header>
<main class="page detail">
 <a class="detail-back" href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Zpět na akce</a>
 <article id="detail"></article>
</main>
<script src="events.js"></script>
<script>
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stripEmoji=s=>String(s||"").replace(/[\p{Extended_Pictographic}\uFE0F]/gu,"").replace(/\s{2,}/g," ").trim();
const id=new URLSearchParams(location.search).get("id");
const e=EVENTS.find(x=>x.id===id);
const root=document.querySelector("#detail");
const sourceLabel=url=>{try{return new URL(url).hostname.replace(/^www\./,"")}catch{return""}};
const CATEGORY_DEFS={rail:["Železnice","fa-train"],bus:["Autobus","fa-bus"],tram:["Tramvaj","fa-tram"],trolleybus:["Trolejbus","fa-bus"],metro:["Metro","fa-subway"],water:["Loď","fa-ship"],air:["Letadlo","fa-plane"],cableway:["Lanovka","fa-mountain"],other:["Ostatní","fa-circle"]};
const eventCategories=e=>(Array.isArray(e.categories)&&e.categories.length?e.categories:[e.category]).filter(Boolean);
const categoryTags=e=>eventCategories(e).map(key=>{const def=CATEGORY_DEFS[key]||CATEGORY_DEFS.other;return '<span class="category category-'+esc(key)+'"><i class="fas '+def[1]+'" aria-hidden="true"></i>'+esc(def[0])+'</span>'}).join("");
const isHumanReviewed=e=>e.reviewStatus==="human_reviewed"||e.reviewed===true;
const displayPlace=e=>e.city||e.place||"";

function term(e){
 const dates=e.to&&e.to!==e.from?e.from+" – "+e.to:e.from;
 const times=e.time?(e.endTime?e.time+"–"+e.endTime:e.time):"";
 return [dates,times].filter(Boolean).join(" · ");
}

if(!e){
 root.innerHTML='<div class="detail-missing"><h1>Akce nenalezena</h1><p>Odkaz už nemusí být platný nebo akce není v aktuálních datech.</p></div>';
}else{
 document.title=stripEmoji(e.title)+" – Šotoušův kalendář";
 root.innerHTML=
  '<header class="event-detail-head">'+
   (eventCategories(e).length||displayPlace(e)?'<div class="detail-meta">'+(eventCategories(e).length?'<div class="detail-categories">'+categoryTags(e)+'</div>':"")+(displayPlace(e)?'<span class="detail-place"><i class="fas fa-map-marker-alt" aria-hidden="true"></i>'+esc(displayPlace(e))+'</span>':"")+'</div>':"")+
   '<h1>'+esc(stripEmoji(e.title))+'</h1>'+
  '</header>'+
  '<div class="event-term">'+esc(term(e))+'</div>'+
  (e.source?'<a class="official-link" href="'+esc(e.source)+'" target="_blank" rel="noopener"><span>Odkaz na akci</span><i class="fas fa-external-link-alt" aria-hidden="true"></i></a>':"")+
  (e.description?'<section class="event-description"><h2>O akci</h2><p>'+esc(e.description)+'</p></section>':"")+
  (!isHumanReviewed(e)?'<aside class="auto-note"><i class="fas fa-robot" aria-hidden="true"></i><p><strong>Tady pracoval robot.</strong> Občas mu něco ujede, takže před cestou raději mrkni na odkaz na akci.</p></aside>':"");
}
</script>
<nav class="mobile-nav" aria-label="Hlavní navigace">
 <a href="index.html"><i class="fas fa-list" aria-hidden="true"></i><span>Akce</span></a>
 <a href="calendar.html"><i class="fas fa-calendar-alt" aria-hidden="true"></i><span>Kalendář</span></a>
 <a href="add.html"><i class="fas fa-plus-circle" aria-hidden="true"></i><span>Přidat</span></a>
 <a href="about.html"><i class="fas fa-info-circle" aria-hidden="true"></i><span>O projektu</span></a>
</nav>
</body>
</html>
